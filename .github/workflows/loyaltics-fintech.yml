name: Loyaltics fintech challenger training
on:
  workflow_dispatch:
  push:
    branches: [loyaltics-vercel]
    paths:
      - continuum/train_fintech.py
      - continuum/fintech_features.py
      - .github/workflows/loyaltics-fintech.yml
permissions:
  contents: write
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: continuum
    env:
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt lightgbm==4.6.0 xgboost==3.0.2 catboost==1.2.8
      - run: python -m py_compile train_fintech.py
      - run: python train_fintech.py
      - uses: actions/upload-artifact@v4
        with:
          name: loyaltics-fintech-validated-candidate
          path: |
            continuum/challenger_artifacts/report.json
            continuum/challenger_artifacts/bundle.joblib
            continuum/challenger_artifacts/default.csv
          if-no-files-found: error
      - name: Publish evaluation and gate approved model
        run: |
          python - <<'PY'
          import json, shutil
          from pathlib import Path
          p=Path('challenger_artifacts')
          r=json.loads((p/'report.json').read_text())
          Path('research').mkdir(exist_ok=True)
          shutil.copy(p/'report.json','research/fintech-evaluation.json')
          if r['release_gate']:
              dst=Path('models/fintech');dst.mkdir(parents=True,exist_ok=True)
              for name in ('bundle.joblib','default.csv'):shutil.copy(p/name,dst/name)
              from fintech_inference import default_payload
              d=default_payload()
              assert len(d['customers'])==1000
              assert all(0<=x['risk']<=1 and x['turnover_cop']>=0 for x in d['customers'])
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/fintech-evaluation.json
          if [ -d models/fintech ]; then git add models/fintech; fi
          if ! git diff --cached --quiet; then
            git commit -m "Publish fintech evaluation and approved inference assets"
            git pull --rebase origin loyaltics-vercel
            git push origin HEAD:loyaltics-vercel
          fi
