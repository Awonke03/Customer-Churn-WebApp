services:
  - type: web
    name: continuum
    runtime: python
    plan: free
    rootDir: continuum
    buildCommand: pip install -r requirements.txt && python -c "from app import load; load()"
    startCommand: gunicorn --workers 1 --threads 2 --timeout 90 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
